name: Update Lotto Data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "package.json"
      - "scripts/update-lotto-data.mjs"
      - "scripts/analyze-recommendations.mjs"
      - "scripts/analysis/**"
      - "scripts/research/**"
      - "src/core/**"
      - "test/**"
  schedule:
    - cron: "0 18,21 * * 6"
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: npick-release
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update generated lotto data
        run: npm run update:data

      - name: Verify weekly cycle and generated modules
        run: npm run check

      - name: Commit changed data
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data/lotto-data.js data/lotto-data.json data/weekly-recommendations.js data/weekly-recommendations.json data/recommendation-analysis.js data/recommendation-analysis.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto-data.js data/lotto-data.json data/weekly-recommendations.js data/weekly-recommendations.json data/recommendation-analysis.js data/recommendation-analysis.json
          git commit -m "data: update lotto draws"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish static files
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-pages.sh

      # Research failures must not delay the normal weekly recommendation release.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/research/requirements.txt

      - name: Install research dependencies
        run: python -m pip install -r scripts/research/requirements.txt

      - name: Verify chronological research and immutable forecasts
        run: npm run research:test

      - name: Evaluate and record research forecasts
        run: npm run research && npm run check

      - name: Commit research results
        id: research
        run: |
          set -euo pipefail
          if git diff --quiet -- data/research-analysis.js data/research-analysis.json data/research-shadow-records.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research-analysis.js data/research-analysis.json data/research-shadow-records.json
          git commit -m "data: record prospective recommendation research"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish research results
        if: steps.research.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-pages.sh
