name: Update Lotto Data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-data.yml"
      - "package.json"
      - "scripts/update-lotto-data.mjs"
      - "src/core/**"
      - "test/**"
  schedule:
    - cron: "0 18,21 * * 6"
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lotto-data
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update generated lotto data
        run: npm run update:data

      - name: Verify weekly cycle and generated modules
        run: npm run check

      - name: Commit changed data
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- data/lotto-data.js data/lotto-data.json data/weekly-recommendations.js data/weekly-recommendations.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lotto-data.js data/lotto-data.json data/weekly-recommendations.js data/weekly-recommendations.json
          git commit -m "data: update lotto draws"
          git push origin main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Publish static files
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/npick-pages
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'screenshots' \
            ./ /tmp/npick-pages/
          cd /tmp/npick-pages
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "deploy: publish NPICK"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
